[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djact"
version = "4.1.2"
description = "HTML-first frontend interaction for Django, JSON-only server, and client-side DOM updates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["django", "frontend", "json", "html", "directives"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/djact"
Repository = "https://github.com/yourusername/djact"
"Bug Tracker" = "https://github.com/yourusername/djact/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["djact*"]

[tool.setuptools.package-data]
djact = [
    "static/djact/*.js",
    "static/djact/*.txt",
    "py.typed",
]
